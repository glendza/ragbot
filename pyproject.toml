[project]
name = "ragbot"
version = "0.1.0"
description = "Domain-specialized AI chatbot with platform-agnostic architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ragbot = "ragbot:__main__.main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pycodestyle]
max-line-length = 119

[tool.mypy]
strict = true
ignore_missing_imports = true
