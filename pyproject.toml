[project]
name = "ragbot"
version = "0.1.0"
description = "Domain-specialized AI chatbot with platform-agnostic architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dependency-injector>=4.45.0, <5.0.0",
    "pydantic>=2.10.6, <3.0.0",
    "pydantic-settings>=2.7.1, <3.0.0",
]

[project.scripts]
ragbot = "ragbot:__main__.main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0, <2.0.0",
    "ruff>=0.9.5, <1.0.0",
]

discord = [
    "discord>=2.3.2, <3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 119

[tool.mypy]
plugins = ['pydantic.mypy']
strict = true
ignore_missing_imports = true
